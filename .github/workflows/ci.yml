name: ci
run-name: ci-${{ inputs.request_id || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique cask-updater validation identifier
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test release-manifest reconciliation
        run: python3 -m unittest discover -s tests

  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Register checked-out tap
        run: brew tap --custom-remote Foxlight-Foundation/skulk "${GITHUB_WORKSPACE}"
      - name: Audit cask
        run: brew audit --cask --strict Foxlight-Foundation/skulk/skulk
      - name: Check cask style
        run: brew style Foxlight-Foundation/skulk/skulk
